<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>世界制覇トラッカー</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #060b18;
      color: #dce6ff;
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ── Header ── */
    header {
      padding: 18px 16px 12px;
      background: linear-gradient(180deg, #0a1228 0%, transparent 100%);
      text-align: center;
    }

    h1 {
      font-size: clamp(1.3rem, 5vw, 2.2rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #ffe066 0%, #ff9500 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 14px;
    }

    /* ── Stats row ── */
    .stats {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .stat-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 14px;
      padding: 10px 18px;
      min-width: 100px;
      text-align: center;
    }

    .stat-number {
      font-size: 1.9rem;
      font-weight: 900;
      line-height: 1;
      color: #ffd24d;
    }

    .stat-number.red   { color: #ff6b6b; }
    .stat-number.green { color: #5ef58a; }

    .stat-label {
      font-size: 0.68rem;
      color: #6677aa;
      margin-top: 3px;
      letter-spacing: 0.05em;
    }

    /* ── Progress ── */
    .progress-wrap {
      width: 90%;
      max-width: 560px;
      margin: 0 auto 6px;
    }

    .progress-bar {
      height: 7px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #ffe066, #ff9500);
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
      width: 0%;
    }

    #remaining-msg {
      text-align: center;
      font-size: 0.82rem;
      color: #8899cc;
      margin-top: 5px;
    }

    #remaining-msg span {
      color: #ffd24d;
      font-weight: 700;
    }

    /* ── Map container ── */
    #map-wrap {
      flex: 1;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 4px 8px;
      cursor: grab;
    }

    #map-wrap:active { cursor: grabbing; }

    svg#world { width: 100%; height: auto; display: block; }

    .sphere   { fill: #0b1526; }
    .graticule { fill: none; stroke: rgba(255,255,255,0.04); stroke-width: 0.4; }
    .borders   { fill: none; stroke: #060b18; stroke-width: 0.6; }

    .country {
      fill: #1a3456;
      stroke: #060b18;
      stroke-width: 0.4;
      cursor: pointer;
      transition: fill 0.18s ease;
    }

    .country:hover   { fill: #2a5080; }
    .country.visited { fill: #ffd24d; }
    .country.visited:hover { fill: #ffb300; }

    /* ── Tooltip ── */
    #tooltip {
      position: fixed;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s;
      z-index: 200;
      background: rgba(6,11,24,0.96);
      border: 1px solid rgba(255,210,77,0.35);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.84rem;
      white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    #tooltip .tt-name   { font-weight: 700; color: #ffd24d; }
    #tooltip .tt-status { color: #8899cc; font-size: 0.72rem; margin-top: 2px; }

    /* ── Footer ── */
    footer {
      padding: 8px 16px 18px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .hint {
      font-size: 0.72rem;
      color: #445577;
    }

    .legend {
      display: flex;
      gap: 16px;
      font-size: 0.72rem;
      color: #6677aa;
    }

    .legend span { display: flex; align-items: center; gap: 5px; }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      display: inline-block;
    }

    .dot.visited  { background: #ffd24d; }
    .dot.unvisited{ background: #1a3456; border: 1px solid #2a5080; }

    .reset-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      color: #556688;
      padding: 6px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.2s;
      font-family: inherit;
    }

    .reset-btn:hover {
      border-color: rgba(255,80,80,0.4);
      color: #ff7777;
      background: rgba(255,50,50,0.07);
    }

    /* ── Celebration modal ── */
    #celebration {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(6,11,24,0.88);
      z-index: 300;
      align-items: center;
      justify-content: center;
    }

    #celebration.show { display: flex; }

    .cel-box {
      background: #0d1a30;
      border: 2px solid #ffd24d;
      border-radius: 20px;
      padding: 40px 50px;
      text-align: center;
      max-width: 380px;
    }

    .cel-box h2 {
      font-size: 2rem;
      color: #ffd24d;
      margin-bottom: 10px;
    }

    .cel-box p { color: #aabbdd; margin-bottom: 20px; }

    .cel-box button {
      background: #ffd24d;
      color: #060b18;
      border: none;
      padding: 10px 28px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
  </style>
</head>
<body>

<header>
  <h1>&#127760; 世界制覇トラッカー</h1>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-number green" id="visited-num">0</div>
      <div class="stat-label">訪問済み</div>
    </div>
    <div class="stat-box">
      <div class="stat-number red" id="remaining-num">???</div>
      <div class="stat-label">残り</div>
    </div>
    <div class="stat-box">
      <div class="stat-number" id="pct-num">0%</div>
      <div class="stat-label">制覇率</div>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>
  <div id="remaining-msg">世界制覇まで残り <span id="remaining-span">???</span> ヵ国</div>
</header>

<div id="map-wrap">
  <svg id="world" viewBox="0 0 960 500"></svg>
</div>

<footer>
  <div class="hint">タップ / クリックで訪問済みを切り替え　ドラッグ・ピンチでズーム</div>
  <div class="legend">
    <span><i class="dot visited"></i>訪問済み</span>
    <span><i class="dot unvisited"></i>未訪問</span>
  </div>
  <button class="reset-btn" id="reset-btn">リセット</button>
</footer>

<div id="tooltip">
  <div class="tt-name" id="tt-name"></div>
  <div class="tt-status" id="tt-status"></div>
</div>

<div id="celebration">
  <div class="cel-box">
    <h2>&#127881; 世界制覇！</h2>
    <p>全ての国を訪問しました！<br>おめでとうございます！</p>
    <button onclick="closeCelebration()">閉じる</button>
  </div>
</div>

<script>
  // ── Country name mapping (ISO 3166-1 numeric → Japanese) ──
  const NAMES = {
    4:"アフガニスタン", 8:"アルバニア", 12:"アルジェリア", 24:"アンゴラ",
    32:"アルゼンチン", 36:"オーストラリア", 40:"オーストリア", 50:"バングラデシュ",
    56:"ベルギー", 64:"ブータン", 68:"ボリビア", 70:"ボスニア・ヘルツェゴビナ",
    72:"ボツワナ", 76:"ブラジル", 84:"ベリーズ", 100:"ブルガリア",
    104:"ミャンマー", 108:"ブルンジ", 112:"ベラルーシ", 116:"カンボジア",
    120:"カメルーン", 124:"カナダ", 132:"カーボベルデ", 140:"中央アフリカ共和国",
    144:"スリランカ", 152:"チリ", 156:"中国", 170:"コロンビア",
    174:"コモロ", 178:"コンゴ共和国", 180:"コンゴ民主共和国", 188:"コスタリカ",
    191:"クロアチア", 192:"キューバ", 196:"キプロス", 203:"チェコ",
    204:"ベナン", 208:"デンマーク", 212:"ドミニカ国", 214:"ドミニカ共和国",
    218:"エクアドル", 222:"エルサルバドル", 226:"赤道ギニア", 231:"エチオピア",
    232:"エリトリア", 233:"エストニア", 238:"フォークランド諸島", 242:"フィジー",
    246:"フィンランド", 250:"フランス", 258:"仏領ポリネシア", 262:"ジブチ",
    266:"ガボン", 268:"ジョージア", 270:"ガンビア", 275:"パレスチナ",
    276:"ドイツ", 288:"ガーナ", 296:"キリバス", 300:"ギリシャ",
    308:"グレナダ", 320:"グアテマラ", 324:"ギニア", 332:"ハイチ",
    340:"ホンジュラス", 348:"ハンガリー", 352:"アイスランド", 356:"インド",
    360:"インドネシア", 364:"イラン", 368:"イラク", 372:"アイルランド",
    376:"イスラエル", 380:"イタリア", 384:"コートジボワール", 388:"ジャマイカ",
    392:"日本", 398:"カザフスタン", 400:"ヨルダン", 404:"ケニア",
    408:"北朝鮮", 410:"韓国", 414:"クウェート", 417:"キルギス",
    418:"ラオス", 422:"レバノン", 426:"レソト", 428:"ラトビア",
    430:"リベリア", 434:"リビア", 440:"リトアニア", 442:"ルクセンブルク",
    450:"マダガスカル", 454:"マラウイ", 458:"マレーシア", 462:"モルディブ",
    466:"マリ", 470:"マルタ", 478:"モーリタニア", 484:"メキシコ",
    496:"モンゴル", 498:"モルドバ", 499:"モンテネグロ", 504:"モロッコ",
    508:"モザンビーク", 512:"オマーン", 516:"ナミビア", 524:"ネパール",
    528:"オランダ", 540:"ニューカレドニア", 548:"バヌアツ", 554:"ニュージーランド",
    558:"ニカラグア", 562:"ニジェール", 566:"ナイジェリア", 578:"ノルウェー",
    583:"ミクロネシア連邦", 584:"マーシャル諸島", 585:"パラオ", 586:"パキスタン",
    591:"パナマ", 598:"パプアニューギニア", 600:"パラグアイ", 604:"ペルー",
    608:"フィリピン", 616:"ポーランド", 620:"ポルトガル", 626:"東ティモール",
    630:"プエルトリコ", 634:"カタール", 642:"ルーマニア", 643:"ロシア",
    646:"ルワンダ", 659:"セントクリストファー・ネービス", 662:"セントルシア",
    670:"セントビンセント・グレナディーン", 678:"サントメ・プリンシペ",
    682:"サウジアラビア", 686:"セネガル", 688:"セルビア", 694:"シエラレオネ",
    703:"スロバキア", 704:"ベトナム", 705:"スロベニア", 706:"ソマリア",
    710:"南アフリカ", 716:"ジンバブエ", 724:"スペイン", 728:"南スーダン",
    729:"スーダン", 740:"スリナム", 748:"エスワティニ", 752:"スウェーデン",
    756:"スイス", 760:"シリア", 762:"タジキスタン", 764:"タイ",
    768:"トーゴ", 776:"トンガ", 780:"トリニダード・トバゴ", 784:"アラブ首長国連邦",
    788:"チュニジア", 792:"トルコ", 795:"トルクメニスタン", 798:"ツバル",
    800:"ウガンダ", 804:"ウクライナ", 807:"北マケドニア", 818:"エジプト",
    826:"イギリス", 840:"アメリカ", 854:"ブルキナファソ", 858:"ウルグアイ",
    860:"ウズベキスタン", 862:"ベネズエラ", 882:"サモア", 887:"イエメン",
    894:"ザンビア",
    // less common but in dataset
    8:"アルバニア", 31:"アゼルバイジャン", 44:"バハマ", 48:"バーレーン",
    51:"アルメニア", 52:"バルバドス", 90:"ソロモン諸島", 474:"マルティニーク",
    624:"ギニアビサウ",
  };

  function getCountryName(id) {
    return NAMES[+id] || `(${id})`;
  }

  // ── State ──
  let totalCountries = 0;
  const visited = new Set(JSON.parse(localStorage.getItem('wmt-visited') || '[]'));

  function save()  { localStorage.setItem('wmt-visited', JSON.stringify([...visited])); }

  function updateUI() {
    const cnt  = visited.size;
    const rem  = Math.max(0, totalCountries - cnt);
    const pct  = totalCountries > 0 ? Math.round(cnt / totalCountries * 100) : 0;

    document.getElementById('visited-num').textContent   = cnt;
    document.getElementById('remaining-num').textContent = rem;
    document.getElementById('pct-num').textContent       = pct + '%';
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('remaining-span').textContent = rem;

    if (totalCountries > 0 && cnt === totalCountries) {
      document.getElementById('celebration').classList.add('show');
    }
  }

  function closeCelebration() {
    document.getElementById('celebration').classList.remove('show');
  }

  document.getElementById('reset-btn').addEventListener('click', () => {
    if (!confirm('訪問履歴をリセットしますか？')) return;
    visited.clear();
    save();
    d3.selectAll('.country').classed('visited', false);
    updateUI();
  });

  // ── Map ──
  const WIDTH  = 960;
  const HEIGHT = 500;
  const svg    = d3.select('#world');
  const g      = svg.append('g');

  const projection = d3.geoNaturalEarth1()
    .scale(153)
    .translate([WIDTH / 2, HEIGHT / 2]);

  const pathGen = d3.geoPath().projection(projection);

  // Sphere (ocean)
  g.append('path')
    .datum({ type: 'Sphere' })
    .attr('class', 'sphere')
    .attr('d', pathGen);

  // Graticule
  g.append('path')
    .datum(d3.geoGraticule()())
    .attr('class', 'graticule')
    .attr('d', pathGen);

  // Tooltip
  const tooltip = document.getElementById('tooltip');
  let tooltipVisible = false;

  function showTip(event, name, isVisited) {
    document.getElementById('tt-name').textContent   = name;
    document.getElementById('tt-status').textContent = isVisited ? '✓ 訪問済み' : 'タップして訪問済みに';
    tooltip.style.opacity = '1';
    moveTip(event);
  }

  function moveTip(event) {
    const x = event.clientX, y = event.clientY;
    const tw = tooltip.offsetWidth  || 160;
    const th = tooltip.offsetHeight || 50;
    const ww = window.innerWidth;
    const wh = window.innerHeight;
    tooltip.style.left = Math.min(x + 14, ww - tw - 8) + 'px';
    tooltip.style.top  = Math.max(y - th - 8, 8) + 'px';
  }

  function hideTip() { tooltip.style.opacity = '0'; }

  // Zoom behaviour
  const zoom = d3.zoom()
    .scaleExtent([1, 12])
    .on('zoom', (event) => {
      g.attr('transform', event.transform);
    });

  svg.call(zoom);

  // Load world data
  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
    .then(world => {
      const countries = topojson.feature(world, world.objects.countries);
      totalCountries  = countries.features.length;

      g.selectAll('.country')
        .data(countries.features)
        .join('path')
          .attr('class', d => 'country' + (visited.has(String(d.id)) ? ' visited' : ''))
          .attr('d', pathGen)
          .on('click', function(event, d) {
            // Ignore clicks that are part of a drag
            if (event.defaultPrevented) return;
            const id = String(d.id);
            if (visited.has(id)) {
              visited.delete(id);
              d3.select(this).classed('visited', false);
            } else {
              visited.add(id);
              d3.select(this).classed('visited', true);
            }
            save();
            updateUI();
            showTip(event, getCountryName(d.id), visited.has(id));
          })
          .on('mousemove', function(event, d) {
            showTip(event, getCountryName(d.id), visited.has(String(d.id)));
          })
          .on('mouseleave', hideTip);

      // Country borders
      g.append('path')
        .datum(topojson.mesh(world, world.objects.countries, (a, b) => a !== b))
        .attr('class', 'borders')
        .attr('d', pathGen);

      updateUI();
    })
    .catch(() => {
      document.getElementById('map-wrap').innerHTML =
        '<p style="color:#ff6b6b;text-align:center;padding:40px">地図データの読み込みに失敗しました。インターネット接続を確認してください。</p>';
    });
</script>
</body>
</html>
