<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>世界制覇トラッカー</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #060b18;
      color: #dce6ff;
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ── Header ── */
    header {
      padding: 18px 16px 12px;
      background: linear-gradient(180deg, #0a1228 0%, transparent 100%);
      text-align: center;
    }

    h1 {
      font-size: clamp(1.3rem, 5vw, 2.2rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #ffe066 0%, #ff9500 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 14px;
    }

    /* ── Stats row ── */
    .stats {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .stat-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 14px;
      padding: 10px 18px;
      min-width: 100px;
      text-align: center;
    }

    .stat-number          { font-size: 1.9rem; font-weight: 900; line-height: 1; color: #ffd24d; }
    .stat-number.red      { color: #ff6b6b; }
    .stat-number.green    { color: #5ef58a; }

    .stat-label {
      font-size: 0.68rem;
      color: #6677aa;
      margin-top: 3px;
      letter-spacing: 0.05em;
    }

    /* ── Progress ── */
    .progress-wrap {
      width: 90%;
      max-width: 560px;
      margin: 0 auto 6px;
    }

    .progress-bar {
      height: 7px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #ffe066, #ff9500);
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
      width: 0%;
    }

    #remaining-msg {
      text-align: center;
      font-size: 0.82rem;
      color: #8899cc;
      margin-top: 5px;
    }

    #remaining-msg span { color: #ffd24d; font-weight: 700; }

    /* ── Map container ── */
    #map-wrap {
      flex: 1;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 4px 8px;
      cursor: grab;
    }

    #map-wrap:active { cursor: grabbing; }
    svg#world { width: 100%; height: auto; display: block; }

    .sphere    { fill: #0b1526; }
    .graticule { fill: none; stroke: rgba(255,255,255,0.04); stroke-width: 0.4; }
    .borders   { fill: none; stroke: rgba(0,0,0,0.5); stroke-width: 0.5; pointer-events: none; }

    /* continent base colors */
    .country {
      stroke: rgba(0,0,0,0.4);
      stroke-width: 0.4;
      cursor: pointer;
      transition: filter 0.15s ease, fill 0.18s ease;
    }

    .country:hover { filter: brightness(1.45); }

    .country[data-c="AS"] { fill: #1a4a6e; }
    .country[data-c="EU"] { fill: #1e4d3a; }
    .country[data-c="AF"] { fill: #5a2a10; }
    .country[data-c="NA"] { fill: #3a2060; }
    .country[data-c="SA"] { fill: #1e4538; }
    .country[data-c="OC"] { fill: #2a3a18; }
    .country[data-c="AN"] { fill: #1a2838; }
    .country              { fill: #1a3456; }   /* fallback */

    .country.visited {
      fill: #ffd24d !important;
      filter: drop-shadow(0 0 4px rgba(255,210,77,0.5));
    }

    .country.visited:hover { filter: brightness(1.15) drop-shadow(0 0 6px rgba(255,210,77,0.7)); }

    /* ── Tooltip ── */
    #tooltip {
      position: fixed;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s;
      z-index: 200;
      background: rgba(6,11,24,0.96);
      border: 1px solid rgba(255,210,77,0.35);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.84rem;
      white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .tt-flag   { font-size: 1.4rem; margin-right: 6px; }
    .tt-name   { font-weight: 700; color: #ffd24d; }
    .tt-status { color: #8899cc; font-size: 0.72rem; margin-top: 2px; }

    /* ── Legend ── */
    .legend-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      font-size: 0.68rem;
      color: #6677aa;
      margin: 4px 0;
    }

    .legend-row span { display: flex; align-items: center; gap: 4px; }

    .ldot {
      width: 10px; height: 10px;
      border-radius: 3px;
      display: inline-block;
      flex-shrink: 0;
    }

    /* ── Visited list panel ── */
    #list-section {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 10px 4px;
    }

    .list-toggle {
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      color: #8899cc;
      font-family: inherit;
      font-size: 0.78rem;
      padding: 8px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.2s;
    }

    .list-toggle:hover { background: rgba(255,255,255,0.06); }

    .list-toggle .arrow { transition: transform 0.25s; }
    .list-toggle.open .arrow { transform: rotate(180deg); }

    #visited-list {
      display: none;
      padding: 10px 4px 4px;
      flex-wrap: wrap;
      gap: 6px;
    }

    #visited-list.open { display: flex; }

    .country-chip {
      background: rgba(255,210,77,0.12);
      border: 1px solid rgba(255,210,77,0.3);
      border-radius: 20px;
      padding: 3px 10px 3px 8px;
      font-size: 0.75rem;
      color: #ffd24d;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .country-chip:hover {
      background: rgba(255,80,80,0.15);
      border-color: rgba(255,80,80,0.4);
      color: #ff8888;
    }

    .country-chip .chip-x { font-size: 0.65rem; opacity: 0.6; }

    #list-empty {
      font-size: 0.75rem;
      color: #445577;
      padding: 6px 4px;
      display: none;
    }

    /* ── Footer ── */
    footer {
      padding: 8px 16px 18px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .hint { font-size: 0.68rem; color: #445577; }

    .reset-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      color: #556688;
      padding: 6px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.2s;
      font-family: inherit;
    }

    .reset-btn:hover {
      border-color: rgba(255,80,80,0.4);
      color: #ff7777;
      background: rgba(255,50,50,0.07);
    }

    /* ── Toast notifications ── */
    #toast-wrap {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 400;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      align-items: center;
    }

    .toast {
      background: #0d1a30;
      border: 1.5px solid #ffd24d;
      border-radius: 12px;
      padding: 10px 22px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #ffd24d;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      animation: toastIn 0.35s ease, toastOut 0.4s ease 2.8s forwards;
      white-space: nowrap;
    }

    @keyframes toastIn  { from { opacity:0; transform:translateY(-16px) scale(0.9); } to { opacity:1; transform:none; } }
    @keyframes toastOut { from { opacity:1; } to { opacity:0; transform:translateY(-8px); } }

    /* ── Celebration modal ── */
    #celebration {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(6,11,24,0.88);
      z-index: 300;
      align-items: center;
      justify-content: center;
    }

    #celebration.show { display: flex; }

    .cel-box {
      background: #0d1a30;
      border: 2px solid #ffd24d;
      border-radius: 20px;
      padding: 40px 50px;
      text-align: center;
      max-width: 380px;
    }

    .cel-box h2  { font-size: 2rem; color: #ffd24d; margin-bottom: 10px; }
    .cel-box p   { color: #aabbdd; margin-bottom: 20px; }
    .cel-box button {
      background: #ffd24d;
      color: #060b18;
      border: none;
      padding: 10px 28px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
  </style>
</head>

</footer>

<div id="tooltip">

<div id="toast-wrap"></div>

    <button onclick="closeCelebration()">閉じる</button>

</div>

  function flag(alpha2) {
    if (!alpha2) return '';
    return [...alpha2.toUpperCase()].map(c =>
      String.fromCodePoint(0x1F1E6 - 65 + c.charCodeAt(0))
    ).join('');
  }

  function getName(id)      { return (COUNTRIES[+id] || [])[0] || `(${id})`; }
  function getAlpha2(id)    { return (COUNTRIES[+id] || [])[1] || ''; }
  function getContinent(id) { return (COUNTRIES[+id] || [])[2] || ''; }

  // ── State ──

  const MILESTONES = [

  function save() { localStorage.setItem('wmt-visited', JSON.stringify([...visited])); }

  function showToast(html) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = html;
    document.getElementById('toast-wrap').appendChild(el);
    setTimeout(() => el.remove(), 3300);
  }

  function checkMilestones(cnt) {
    for (const [n, msg] of MILESTONES) {
      if (cnt >= n && !toastedMilestones.has(n)) {
        toastedMilestones.add(n);
        localStorage.setItem('wmt-milestones', JSON.stringify([...toastedMilestones]));
        showToast(msg);
      }
    }
  }

  function updateUI() {
    const cnt = visited.size;
    const rem = Math.max(0, totalCountries - cnt);
    const pct = totalCountries > 0 ? Math.round(cnt / totalCountries * 100) : 0;

    document.getElementById('visited-num').textContent   = cnt;
    document.getElementById('remaining-num').textContent = rem;
    document.getElementById('pct-num').textContent       = pct + '%';
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('remaining-span').textContent = rem;
    document.getElementById('list-count').textContent    = cnt;

    updateList();
    checkMilestones(cnt);

    if (totalCountries > 0 && cnt === totalCountries) {
      document.getElementById('celebration').classList.add('show');
    }
  }

  // ── Visited list panel ──
  function updateList() {
    const panel = document.getElementById('visited-list');
    const empty = document.getElementById('list-empty');
    const sorted = [...visited].map(id => ({
      id,
      name: getName(id),
      f: flag(getAlpha2(id)),
    })).sort((a, b) => a.name.localeCompare(b.name, 'ja'));

    // remove existing chips
    panel.querySelectorAll('.country-chip').forEach(el => el.remove());

    if (sorted.length === 0) {
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      sorted.forEach(({ id, name, f }) => {
        const chip = document.createElement('span');
        chip.className = 'country-chip';
        chip.dataset.id = id;
        chip.innerHTML = `${f} ${name} <span class="chip-x">✕</span>`;
        chip.addEventListener('click', () => removeCountry(id));
        panel.appendChild(chip);
      });
    }
  }

  function removeCountry(id) {
    visited.delete(String(id));
    save();
    d3.selectAll('.country').filter(d => String(d.id) === String(id)).classed('visited', false);
    updateUI();
  }

  document.getElementById('list-toggle').addEventListener('click', function () {
    this.classList.toggle('open');
    document.getElementById('visited-list').classList.toggle('open');
  });

  document.getElementById('reset-btn').addEventListener('click', () => {
    if (!confirm('訪問履歴をリセットしますか？')) return;
    visited.clear();
    toastedMilestones.clear();
    localStorage.removeItem('wmt-visited');
    localStorage.removeItem('wmt-milestones');
    save();
    d3.selectAll('.country').classed('visited', false);
    updateUI();
  });

  function closeCelebration() {
    document.getElementById('celebration').classList.remove('show');
  }

  // ── Map ──
  const WIDTH = 960, HEIGHT = 500;
  const svg   = d3.select('#world');
  const g     = svg.append('g');

  const projection = d3.geoNaturalEarth1()
    .scale(153)
    .translate([WIDTH / 2, HEIGHT / 2]);

  const pathGen = d3.geoPath().projection(projection);

  g.append('path').datum({ type: 'Sphere' }).attr('class', 'sphere').attr('d', pathGen);
  g.append('path').datum(d3.geoGraticule()()).attr('class', 'graticule').attr('d', pathGen);

  // Tooltip
  const tooltip = document.getElementById('tooltip');

  function showTip(event, id, isV) {
    const name = getName(id);
    const f    = flag(getAlpha2(id));
    document.getElementById('tt-flag').textContent   = f;
    document.getElementById('tt-name').textContent   = name;
    document.getElementById('tt-status').textContent = isV ? '✓ 訪問済み — もう一度タップで解除' : 'タップして訪問済みに';
    tooltip.style.opacity = '1';
    moveTip(event);
  }

  function moveTip(event) {
    const x = event.clientX, y = event.clientY;
    const tw = tooltip.offsetWidth  || 180;
    const th = tooltip.offsetHeight || 54;
    tooltip.style.left = Math.min(x + 14, window.innerWidth  - tw - 8) + 'px';
    tooltip.style.top  = Math.max(y - th - 8, 8) + 'px';
  }

  function hideTip() { tooltip.style.opacity = '0'; }

  // Zoom
  const zoom = d3.zoom()
    .scaleExtent([1, 12])
    .on('zoom', ev => g.attr('transform', ev.transform));

  svg.call(zoom);

  // Load world data
  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
    .then(world => {
      const features = topojson.feature(world, world.objects.countries).features;
      totalCountries = features.length;

      g.selectAll('.country')
        .data(features)
        .join('path')
          .attr('class', d => 'country' + (visited.has(String(d.id)) ? ' visited' : ''))
          .attr('data-c', d => getContinent(d.id))
          .attr('d', pathGen)
          .on('click', function(event, d) {
            if (event.defaultPrevented) return;
            const id = String(d.id);
            const wasV = visited.has(id);
            if (wasV) {
              visited.delete(id);
              d3.select(this).classed('visited', false);
            } else {
              visited.add(id);
              d3.select(this).classed('visited', true);
            }
            save();
            updateUI();
            showTip(event, d.id, !wasV);
          })
          .on('mousemove', function(event, d) {
            showTip(event, d.id, visited.has(String(d.id)));
          })
          .on('mouseleave', hideTip);

      g.append('path')
        .datum(topojson.mesh(world, world.objects.countries, (a, b) => a !== b))
        .attr('class', 'borders')
        .attr('d', pathGen);

      updateUI();
    })
    .catch(() => {
      document.getElementById('map-wrap').innerHTML =
        '<p style="color:#ff6b6b;text-align:center;padding:40px">地図データの読み込みに失敗しました。インターネット接続を確認してください。</p>';
    });
</script>
</body>
</html>
