<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
  <title>北海道本格ジンギスカン ひつじや｜注文管理</title>

  <style>
    :root{
      --bg:#0b0d10;
      --line:rgba(255,255,255,.08);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.58);
      --gold:#c8a45a;
      --danger:#a40000;
      --danger2:#7c0000;
      --ok:#1e8e3e;
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --radius:18px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(200,164,90,.12), transparent 70%),
        radial-gradient(900px 500px at 90% 0%, rgba(200,164,90,.08), transparent 70%),
        var(--bg);
      color:var(--text);
      overflow-x:hidden;
    }

    .wrap{
      max-width:1200px;
      margin:0 auto;
      padding:20px 12px 90px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:12px 0 18px;
      border-bottom:1px solid var(--line);
      margin-bottom:14px;
    }

    .titleWrap{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .sheep-icon{
      width:30px;
      height:30px;
      object-fit:contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.45));
      opacity:.95;
      flex:0 0 auto;
    }

    .titleBlock{
      min-width:0;
    }

    .title{
      margin:0;
      color:var(--gold);
      font-size:clamp(22px, 4vw, 30px);
      font-weight:1000;
      line-height:1.1;
    }

    .sub{
      margin:6px 0 0;
      color:var(--muted);
      font-size:13px;
    }

    .topActions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .btn{
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.03);
      color:rgba(255,255,255,.92);
      border-radius:14px;
      padding:10px 14px;
      font-weight:1000;
      cursor:pointer;
      white-space:nowrap;
    }

    .btn:hover{
      background:rgba(255,255,255,.06);
    }

    .btn.gold{
      border-color:rgba(200,164,90,.45);
      background:rgba(200,164,90,.10);
      color:var(--gold);
    }

    .btn.red{
      border-color:rgba(164,0,0,.35);
      background:rgba(164,0,0,.18);
      color:#fff;
    }

    .statusRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.18);
      color:var(--muted);
      font-size:12px;
      font-weight:900;
    }

    .pill strong{
      color:var(--text);
    }

    .pill.ok{
      border-color:rgba(30,142,62,.35);
      background:rgba(30,142,62,.12);
      color:#b8f2c8;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:14px;
    }

    @media (min-width: 1000px){
      .grid{
        grid-template-columns: 1fr 320px;
        align-items:start;
      }
    }

    .card{
      background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .panelTitle{
      padding:14px 16px;
      font-weight:1000;
      color:var(--gold);
      border-bottom:1px solid var(--line);
      background:rgba(0,0,0,.18);
      letter-spacing:.04em;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    .panelBody{
      padding:14px;
    }

    .orderList{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .orderCard{
      border:1px solid var(--line);
      border-radius:16px;
      background:rgba(0,0,0,.20);
      padding:12px;
    }

    .orderCard.new{
      box-shadow:0 0 0 1px rgba(200,164,90,.35);
    }

    .orderTop{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }

    .tableNo{
      font-size:18px;
      font-weight:1000;
      color:var(--gold);
      line-height:1.2;
    }

    .meta{
      color:var(--muted);
      font-size:12px;
      line-height:1.4;
      text-align:right;
    }

    .typeBadge{
      display:inline-flex;
      align-items:center;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid rgba(200,164,90,.35);
      background:rgba(200,164,90,.10);
      color:var(--gold);
      font-size:12px;
      font-weight:1000;
      margin-top:6px;
    }

    .items{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-top:10px;
    }

    .itemRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border:1px solid var(--line);
      border-radius:12px;
      background:rgba(255,255,255,.03);
      padding:10px 12px;
    }

    .itemName{
      font-weight:900;
      line-height:1.3;
    }

    .itemQty{
      color:var(--text);
      font-weight:1000;
      white-space:nowrap;
    }

    .orderBottom{
      margin-top:12px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .doneBtn,
    .deleteBtn{
      flex:1;
      min-width:120px;
      border-radius:12px;
      padding:10px 12px;
      font-weight:1000;
      cursor:pointer;
    }

    .doneBtn{
      border:1px solid rgba(30,142,62,.35);
      background:rgba(30,142,62,.16);
      color:#eaffef;
    }

    .deleteBtn{
      border:1px solid rgba(164,0,0,.35);
      background:rgba(164,0,0,.18);
      color:#fff;
    }

    .empty{
      color:var(--muted);
      text-align:center;
      padding:20px 12px;
      border:1px dashed var(--line);
      border-radius:14px;
      background:rgba(255,255,255,.02);
    }

    .sideList{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .sideStat{
      border:1px solid var(--line);
      border-radius:14px;
      background:rgba(0,0,0,.20);
      padding:12px;
    }

    .sideStatTitle{
      color:var(--muted);
      font-size:12px;
      margin-bottom:6px;
      font-weight:900;
    }

    .sideStatValue{
      font-size:24px;
      color:var(--gold);
      font-weight:1000;
      line-height:1.1;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:24px;
      transform:translateX(-50%);
      background:rgba(16,19,24,.94);
      border:1px solid var(--line);
      color:var(--text);
      padding:12px 14px;
      border-radius:14px;
      box-shadow:var(--shadow);
      font-weight:900;
      display:none;
      max-width:min(560px, 92vw);
      z-index:9999;
      text-align:center;
    }

    @media (max-width: 700px){
      .topbar{
        align-items:flex-start;
        flex-direction:column;
      }

      .topActions{
        width:100%;
        justify-content:flex-start;
      }

      .orderTop{
        flex-direction:column;
      }

      .meta{
        text-align:left;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="titleWrap">
        <img src="assets/hitsuji.png" alt="ひつじ" class="sheep-icon" onerror="this.style.display='none'">
        <div class="titleBlock">
          <h1 class="title">注文管理</h1>
          <p class="sub">飲み放題オーダーをリアルタイムで確認できます</p>
        </div>
      </div>

      <div class="topActions">
        <button id="enableSoundBtn" class="btn gold">音をON</button>
        <button id="reloadBtn" class="btn">再読込</button>
      </div>
    </div>

    <div class="statusRow">
      <div class="pill">状態 <strong id="soundStatus">音OFF</strong></div>
      <div class="pill">表示件数 <strong id="countText">0</strong></div>
      <div class="pill ok">対象 <strong>orders</strong></div>
    </div>

    <div class="grid">
      <section class="card">
        <div class="panelTitle">
          <span>新着注文一覧</span>
          <span id="latestTime" style="font-size:12px;color:rgba(255,255,255,.72);font-weight:900;">-</span>
        </div>
        <div class="panelBody">
          <div id="orderList" class="orderList"></div>
        </div>
      </section>

      <aside class="card">
        <div class="panelTitle">概要</div>
        <div class="panelBody">
          <div class="sideList">
            <div class="sideStat">
              <div class="sideStatTitle">現在の注文数</div>
              <div id="statOrders" class="sideStatValue">0</div>
            </div>

            <div class="sideStat">
              <div class="sideStatTitle">合計点数</div>
              <div id="statQty" class="sideStatValue">0</div>
            </div>

            <div class="sideStat">
              <div class="sideStatTitle">最新テーブル</div>
              <div id="statTable" class="sideStatValue">-</div>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import {
      getFirestore,
      collection,
      query,
      orderBy,
      onSnapshot,
      limit,
      deleteDoc,
      doc
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBwehYqjyO7R982qHjTMiNGjQ2yPNEA7YU",
      authDomain: "order-app-ec18b.firebaseapp.com",
      projectId: "order-app-ec18b",
      storageBucket: "order-app-ec18b.firebasestorage.app",
      messagingSenderId: "756193856808",
      appId: "1:756193856808:web:f2200287017adaf895541d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const orderList = document.getElementById("orderList");
    const enableSoundBtn = document.getElementById("enableSoundBtn");
    const reloadBtn = document.getElementById("reloadBtn");
    const soundStatus = document.getElementById("soundStatus");
    const countText = document.getElementById("countText");
    const latestTime = document.getElementById("latestTime");
    const statOrders = document.getElementById("statOrders");
    const statQty = document.getElementById("statQty");
    const statTable = document.getElementById("statTable");

    let soundEnabled = false;
    let audioCtx = null;
    let initialized = false;
    let knownIds = new Set();

    function toast(msg){
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => t.style.display = "none", 2200);
    }

    function formatTime(ts){
      try{
        if (!ts?.toDate) return "-";
        return ts.toDate().toLocaleString("ja-JP", {
          month:"2-digit",
          day:"2-digit",
          hour:"2-digit",
          minute:"2-digit",
          second:"2-digit"
        });
      } catch {
        return "-";
      }
    }

    function ensureAudio(){
      if (!audioCtx){
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        audioCtx = new Ctx();
      }
      return audioCtx;
    }

    async function enableSound(){
      try{
        const ctx = ensureAudio();
        if (!ctx){
          soundStatus.textContent = "非対応";
          toast("この端末では音が使えません");
          return;
        }

        if (ctx.state === "suspended"){
          await ctx.resume();
        }

        soundEnabled = true;
        soundStatus.textContent = "音ON";
        toast("音を有効にしました");
      } catch (e){
        console.error(e);
        toast("音の有効化に失敗しました");
      }
    }

    function playNewOrderSound(){
      if (!soundEnabled) return;

      try{
        const ctx = ensureAudio();
        if (!ctx) return;

        const now = ctx.currentTime;

        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = "sine";
        osc1.frequency.setValueAtTime(880, now);
        osc1.frequency.exponentialRampToValueAtTime(660, now + 0.12);
        gain1.gain.setValueAtTime(0.0001, now);
        gain1.gain.exponentialRampToValueAtTime(0.08, now + 0.01);
        gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.18);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = "triangle";
        osc2.frequency.setValueAtTime(1046, now + 0.16);
        osc2.frequency.exponentialRampToValueAtTime(880, now + 0.30);
        gain2.gain.setValueAtTime(0.0001, now + 0.16);
        gain2.gain.exponentialRampToValueAtTime(0.07, now + 0.18);
        gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.34);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.16);
        osc2.stop(now + 0.34);
      } catch (e){
        console.error(e);
      }
    }

    function calcTotalQty(data){
      const items = Array.isArray(data?.items) ? data.items : [];
      return items.reduce((sum, item) => sum + Number(item?.qty || 0), 0);
    }

    function renderOrders(docs){
      countText.textContent = String(docs.length);
      statOrders.textContent = String(docs.length);

      const totalQty = docs.reduce((sum, d) => sum + calcTotalQty(d.data()), 0);
      statQty.textContent = String(totalQty);

      if (docs[0]){
        const top = docs[0].data();
        statTable.textContent = top?.table ?? "-";
        latestTime.textContent = formatTime(top?.createdAt);
      } else {
        statTable.textContent = "-";
        latestTime.textContent = "-";
      }

      if (!docs.length){
        orderList.innerHTML = `<div class="empty">まだ注文はありません</div>`;
        return;
      }

      orderList.innerHTML = docs.map(d => {
        const data = d.data();
        const items = Array.isArray(data?.items) ? data.items : [];
        const qty = calcTotalQty(data);

        const itemsHtml = items.map(item => `
          <div class="itemRow">
            <div class="itemName">${item?.name ?? "-"}</div>
            <div class="itemQty">×${Number(item?.qty || 0)}</div>
          </div>
        `).join("");

        return `
          <div class="orderCard new" data-id="${d.id}">
            <div class="orderTop">
              <div>
                <div class="tableNo">テーブル ${data?.table ?? "-"}</div>
                <div class="typeBadge">${data?.type === "drink" ? "ドリンク注文" : "注文"}</div>
              </div>
              <div class="meta">
                <div>${formatTime(data?.createdAt)}</div>
                <div>合計点数: ${qty}</div>
              </div>
            </div>

            <div class="items">
              ${itemsHtml || `<div class="itemRow"><div class="itemName">-</div><div class="itemQty">×0</div></div>`}
            </div>

            <div class="orderBottom">
              <button class="doneBtn" data-done="${d.id}">完了</button>
              <button class="deleteBtn" data-delete="${d.id}">削除</button>
            </div>
          </div>
        `;
      }).join("");
    }

    async function removeOrder(id){
      try{
        await deleteDoc(doc(db, "orders", id));
        toast("注文を削除しました");
      } catch (e){
        console.error(e);
        toast("削除に失敗しました");
      }
    }

    enableSoundBtn?.addEventListener("click", enableSound);
    reloadBtn?.addEventListener("click", () => location.reload());

    orderList?.addEventListener("click", async (e) => {
      const doneBtn = e.target.closest("[data-done]");
      const deleteBtn = e.target.closest("[data-delete]");

      if (doneBtn){
        const id = doneBtn.getAttribute("data-done");
        const ok = confirm("この注文を完了として消しますか？");
        if (!ok) return;
        await removeOrder(id);
        return;
      }

      if (deleteBtn){
        const id = deleteBtn.getAttribute("data-delete");
        const ok = confirm("この注文を削除しますか？");
        if (!ok) return;
        await removeOrder(id);
      }
    });

    const q = query(
      collection(db, "orders"),
      orderBy("createdAt", "desc"),
      limit(50)
    );

    onSnapshot(q, (snapshot) => {
      renderOrders(snapshot.docs);

      const currentIds = new Set(snapshot.docs.map(doc => doc.id));

      if (!initialized){
        knownIds = currentIds;
        initialized = true;
        return;
      }

      let hasNewOrder = false;
      for (const docSnap of snapshot.docs){
        if (!knownIds.has(docSnap.id)){
          hasNewOrder = true;
          break;
        }
      }

      if (hasNewOrder){
        playNewOrderSound();
        toast("新しい注文が入りました");
      }

      knownIds = currentIds;
    }, (error) => {
      console.error(error);
      orderList.innerHTML = `<div class="empty">注文の取得に失敗しました</div>`;
      toast("Firestoreの取得に失敗しました");
    });
  </script>
</body>
</html>
