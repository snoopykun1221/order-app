<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>注文管理</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#0b0d10;
  color:#fff;
}

.wrap{
  padding:16px;
}

h1{
  color:#c8a45a;
  margin-bottom:10px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

button{
  border:none;
  padding:10px 14px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.sound{
  background:#c8a45a;
  color:#000;
}

.card{
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-bottom:6px;
}

.table{
  font-weight:bold;
  color:#c8a45a;
}

.item{
  display:flex;
  justify-content:space-between;
  border-top:1px solid rgba(255,255,255,.1);
  padding-top:6px;
  margin-top:6px;
}

.done{
  margin-top:10px;
  background:#a40000;
  color:#fff;
  width:100%;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="top">
    <h1>注文管理</h1>
    <button id="soundBtn" class="sound">音ON</button>
  </div>

  <div id="list"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot,
  limit,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyBwehY...",
  authDomain: "order-app-ec18b.firebaseapp.com",
  projectId: "order-app-ec18b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const listEl = document.getElementById("list");
const soundBtn = document.getElementById("soundBtn");

// ===== 音 =====
let audioCtx;
let soundEnabled = false;

function enableSound(){
  const Ctx = window.AudioContext || window.webkitAudioContext;
  audioCtx = new Ctx();
  soundEnabled = true;
  alert("音ON");
}

function playSound(){
  if(!soundEnabled) return;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";
  osc.frequency.value = 800;

  gain.gain.value = 0.1;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.2);
}

soundBtn.onclick = enableSound;

// ===== 表示 =====
let first = true;
let known = new Set();

function render(docs){
  if(!docs.length){
    listEl.innerHTML = "注文なし";
    return;
  }

  listEl.innerHTML = docs.map(d=>{
    const data = d.data();

    const items = data.items.map(i=>`
      <div class="item">
        <span>${i.name}</span>
        <strong>×${i.qty}</strong>
      </div>
    `).join("");

    return `
      <div class="card">
        <div class="row">
          <div class="table">テーブル ${data.table}</div>
        </div>

        ${items}

        <button class="done" data-id="${d.id}">
          完了（消す）
        </button>
      </div>
    `;
  }).join("");
}

// ===== Firestore監視 =====
const q = query(
  collection(db,"orders"),
  orderBy("createdAt","desc"),
  limit(50)
);

onSnapshot(q,(snap)=>{
  render(snap.docs);

  const current = new Set(snap.docs.map(d=>d.id));

  if(!first){
    for(const d of snap.docs){
      if(!known.has(d.id)){
        playSound();
        break;
      }
    }
  }

  first = false;
  known = current;
});

// ===== 完了ボタン =====
listEl.addEventListener("click",async(e)=>{
  const btn = e.target.closest("[data-id]");
  if(!btn) return;

  const id = btn.dataset.id;

  await deleteDoc(doc(db,"orders",id));
});
</script>

</body>
</html>
