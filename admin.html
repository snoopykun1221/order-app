<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
  <title>北海道本格ジンギスカン ひつじや｜注文管理</title>

  <style>
    :root{
      --bg:#3b2a20;
      --bg2:#2b1d16;
      --line:rgba(255,245,230,.14);
      --text:#fff8f0;
      --muted:rgba(255,240,225,.72);
      --gold:#e0b86b;
      --danger:#8f1f1f;
      --danger2:#6f1313;
      --ok:#3f7a4a;
      --ok2:#2f5e38;
      --shadow:0 18px 60px rgba(0,0,0,.35);
      --radius:18px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(224,184,107,.12), transparent 70%),
        radial-gradient(900px 500px at 90% 0%, rgba(224,184,107,.08), transparent 70%),
        linear-gradient(180deg,#5a4030 0%, var(--bg) 55%, var(--bg2) 100%);
      color:var(--text);
      min-height:100vh;
    }

    .wrap{
      max-width:1200px;
      margin:0 auto;
      padding:20px 12px 40px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:10px 0 18px;
      border-bottom:1px solid var(--line);
      margin-bottom:16px;
    }

    .titleArea{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .sheep-icon{
      width:30px;
      height:30px;
      flex:0 0 auto;
      filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));
      opacity:.95;
      object-fit:contain;
    }

    .titleText{
      min-width:0;
    }

    .title{
      margin:0;
      font-size:clamp(20px, 4.6vw, 30px);
      font-weight:1000;
      letter-spacing:.05em;
      color:var(--gold);
      line-height:1.15;
    }

    .sub{
      margin:6px 0 0;
      color:var(--muted);
      font-size:13px;
    }

    .actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .btn{
      border:none;
      cursor:pointer;
      font-weight:1000;
      transition:transform .12s ease, filter .18s ease, box-shadow .18s ease;
      font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
      border-radius:14px;
      padding:12px 14px;
      font-size:14px;
    }

    .btn:hover{
      filter:brightness(1.04);
    }

    .btn:active{
      transform:scale(.97);
    }

    .btn.sound{
      background:linear-gradient(180deg, rgba(224,184,107,.22), rgba(170,120,55,.18));
      color:var(--gold);
      border:1px solid rgba(224,184,107,.38);
    }

    .btn.reload{
      background:rgba(255,248,240,.06);
      color:var(--text);
      border:1px solid var(--line);
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:12px;
      margin-bottom:16px;
    }

    .statCard{
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px;
      background:linear-gradient(180deg, rgba(255,248,240,.06), rgba(255,248,240,.03));
      box-shadow:var(--shadow);
    }

    .statLabel{
      font-size:12px;
      color:var(--muted);
      margin-bottom:8px;
    }

    .statValue{
      font-size:26px;
      font-weight:1000;
      color:var(--gold);
      line-height:1.1;
    }

    .panel{
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
      background:linear-gradient(180deg, rgba(255,248,240,.05), rgba(255,248,240,.025));
      box-shadow:var(--shadow);
    }

    .panelTitle{
      padding:14px 16px;
      font-weight:1000;
      color:var(--gold);
      border-bottom:1px solid var(--line);
      background:rgba(255,248,240,.05);
      letter-spacing:.08em;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .panelBody{
      padding:14px;
    }

    .muted{
      color:var(--muted);
      font-size:12px;
    }

    .orderList{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .orderCard{
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px;
      background:
        linear-gradient(180deg, rgba(255,248,240,.09), rgba(255,248,240,.045)),
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.07) 0 8%, transparent 9%),
        radial-gradient(circle at 75% 35%, rgba(255,255,255,.05) 0 7%, transparent 8%),
        radial-gradient(circle at 40% 80%, rgba(255,255,255,.04) 0 6%, transparent 7%),
        linear-gradient(135deg, rgba(255,250,242,.10), rgba(235,220,195,.05));
      background-size:auto, 180px 180px, 220px 220px, 200px 200px, auto;
      position:relative;
      overflow:hidden;
    }

    .orderCard::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,.018) 0px,
          rgba(255,255,255,.018) 1px,
          transparent 1px,
          transparent 4px
        );
      opacity:.25;
    }

    .orderHead{
      position:relative;
      z-index:1;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
    }

    .tableNo{
      font-size:22px;
      font-weight:1000;
      color:var(--gold);
      line-height:1.1;
    }

    .orderMeta{
      color:var(--muted);
      font-size:12px;
      text-align:right;
      line-height:1.5;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid rgba(224,184,107,.35);
      background:rgba(224,184,107,.10);
      color:var(--gold);
      font-size:12px;
      font-weight:1000;
      margin-top:8px;
    }

    .itemList{
      position:relative;
      z-index:1;
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-bottom:12px;
    }

    .itemRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border:1px solid var(--line);
      border-radius:12px;
      background:rgba(255,248,240,.05);
      padding:10px 12px;
    }

    .itemName{
      font-weight:1000;
      line-height:1.4;
    }

    .itemQty{
      white-space:nowrap;
      font-weight:1000;
      color:var(--gold);
    }

    .orderFoot{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    .totalQty{
      color:var(--text);
      font-weight:1000;
    }

    .doneBtn{
      background:linear-gradient(180deg, var(--ok), var(--ok2));
      color:#fff;
      border:none;
      border-radius:12px;
      padding:10px 14px;
      font-weight:1000;
      cursor:pointer;
      transition:transform .12s ease, filter .18s ease;
      font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    }

    .doneBtn:hover{
      filter:brightness(1.05);
    }

    .doneBtn:active{
      transform:scale(.97);
    }

    .empty{
      padding:22px 14px;
      text-align:center;
      color:var(--muted);
      border:1px dashed var(--line);
      border-radius:14px;
      background:rgba(255,248,240,.03);
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:24px;
      transform:translateX(-50%);
      background:rgba(56,38,28,.95);
      border:1px solid var(--line);
      color:var(--text);
      padding:12px 14px;
      border-radius:14px;
      box-shadow:var(--shadow);
      font-weight:900;
      display:none;
      max-width:min(560px, 92vw);
      z-index:9999;
      text-align:center;
    }

    @media (max-width: 800px){
      .topbar{
        flex-direction:column;
        align-items:flex-start;
      }

      .actions{
        width:100%;
        justify-content:flex-start;
      }

      .stats{
        grid-template-columns:1fr;
      }

      .orderHead{
        flex-direction:column;
      }

      .orderMeta{
        text-align:left;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="titleArea">
        <img src="assets/sheep.png.jpg" alt="ひつじ" class="sheep-icon" onerror="this.style.display='none'">
        <div class="titleText">
          <h1 class="title">注文管理</h1>
          <p class="sub">飲み放題オーダーをリアルタイムで確認できます</p>
        </div>
      </div>

      <div class="actions">
        <button id="soundBtn" class="btn sound">音をON</button>
        <button id="reloadBtn" class="btn reload">再読み込み</button>
      </div>
    </div>

    <div class="stats">
      <div class="statCard">
        <div class="statLabel">現在の注文数</div>
        <div id="statOrderCount" class="statValue">0</div>
      </div>
      <div class="statCard">
        <div class="statLabel">合計点数</div>
        <div id="statQtyCount" class="statValue">0</div>
      </div>
      <div class="statCard">
        <div class="statLabel">音の状態</div>
        <div id="statSound" class="statValue" style="font-size:20px;">OFF</div>
      </div>
    </div>

    <div class="panel">
      <div class="panelTitle">
        <span>注文一覧</span>
        <span class="muted">新しい順</span>
      </div>
      <div class="panelBody">
        <div id="orderList" class="orderList"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import {
      getFirestore,
      collection,
      query,
      orderBy,
      onSnapshot,
      limit,
      deleteDoc,
      doc
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBwehYqjyO7R982qHjTMiNGjQ2yPNEA7YU",
      authDomain: "order-app-ec18b.firebaseapp.com",
      projectId: "order-app-ec18b",
      storageBucket: "order-app-ec18b.firebasestorage.app",
      messagingSenderId: "756193856808",
      appId: "1:756193856808:web:f2200287017adaf895541d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const orderList = document.getElementById("orderList");
    const statOrderCount = document.getElementById("statOrderCount");
    const statQtyCount = document.getElementById("statQtyCount");
    const statSound = document.getElementById("statSound");
    const soundBtn = document.getElementById("soundBtn");
    const reloadBtn = document.getElementById("reloadBtn");

    let audioCtx = null;
    let soundEnabled = false;
    let initialized = false;
    let knownIds = new Set();

    function toast(msg){
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => t.style.display = "none", 2200);
    }

    function ensureAudio(){
      if (!audioCtx){
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        audioCtx = new Ctx();
      }
      return audioCtx;
    }

    async function enableSound(){
      try{
        const ctx = ensureAudio();
        if (!ctx){
          toast("この端末では音が使えません");
          return;
        }
        if (ctx.state === "suspended"){
          await ctx.resume();
        }
        soundEnabled = true;
        statSound.textContent = "ON";
        toast("音を有効にしました");
      } catch (e){
        console.error(e);
        toast("音の有効化に失敗しました");
      }
    }

    function playSound(){
      if (!soundEnabled) return;
      try{
        const ctx = ensureAudio();
        if (!ctx) return;

        const now = ctx.currentTime;

        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = "sine";
        osc1.frequency.setValueAtTime(880, now);
        osc1.frequency.exponentialRampToValueAtTime(660, now + 0.12);
        gain1.gain.setValueAtTime(0.0001, now);
        gain1.gain.exponentialRampToValueAtTime(0.08, now + 0.01);
        gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.18);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = "triangle";
        osc2.frequency.setValueAtTime(1046, now + 0.16);
        osc2.frequency.exponentialRampToValueAtTime(880, now + 0.30);
        gain2.gain.setValueAtTime(0.0001, now + 0.16);
        gain2.gain.exponentialRampToValueAtTime(0.07, now + 0.18);
        gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.34);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.16);
        osc2.stop(now + 0.34);
      } catch (e){
        console.error(e);
      }
    }

    function formatTime(ts){
      try{
        if (!ts?.toDate) return "-";
        return ts.toDate().toLocaleString("ja-JP", {
          month:"2-digit",
          day:"2-digit",
          hour:"2-digit",
          minute:"2-digit",
          second:"2-digit"
        });
      } catch {
        return "-";
      }
    }

    function totalQty(items){
      return (items || []).reduce((sum, item) => sum + Number(item.qty || 0), 0);
    }

    async function completeOrder(id){
      try{
        await deleteDoc(doc(db, "orders", id));
        toast("注文を完了にしました");
      } catch (e){
        console.error(e);
        toast("削除に失敗しました");
      }
    }

    function renderOrders(docs){
      statOrderCount.textContent = String(docs.length);

      const qtySum = docs.reduce((sum, d) => {
        const data = d.data();
        return sum + totalQty(data.items || []);
      }, 0);
      statQtyCount.textContent = String(qtySum);

      if (!docs.length){
        orderList.innerHTML = `<div class="empty">現在、注文はありません</div>`;
        return;
      }

      orderList.innerHTML = docs.map(d => {
        const data = d.data();
        const items = data.items || [];
        const qty = totalQty(items);

        return `
          <div class="orderCard">
            <div class="orderHead">
              <div>
                <div class="tableNo">テーブル ${data.table ?? "-"}</div>
                <div class="badge">${data.type === "drink" ? "ドリンク注文" : "注文"}</div>
              </div>
              <div class="orderMeta">
                <div>${formatTime(data.createdAt)}</div>
                <div>合計 ${qty} 点</div>
              </div>
            </div>

            <div class="itemList">
              ${items.map(item => `
                <div class="itemRow">
                  <div class="itemName">${item.name}</div>
                  <div class="itemQty">×${item.qty}</div>
                </div>
              `).join("")}
            </div>

            <div class="orderFoot">
              <div class="totalQty">注文点数：${qty}</div>
              <button class="doneBtn" data-done="${d.id}">完了</button>
            </div>
          </div>
        `;
      }).join("");
    }

    orderList.addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-done]");
      if (!btn) return;

      const id = btn.getAttribute("data-done");
      const ok = confirm("この注文を完了にしますか？");
      if (!ok) return;
      await completeOrder(id);
    });

    soundBtn.addEventListener("click", enableSound);
    reloadBtn.addEventListener("click", () => location.reload());

    const q = query(
      collection(db, "orders"),
      orderBy("createdAt", "desc"),
      limit(50)
    );

    onSnapshot(q, (snapshot) => {
      renderOrders(snapshot.docs);

      const currentIds = new Set(snapshot.docs.map(d => d.id));

      if (!initialized){
        knownIds = currentIds;
        initialized = true;
        return;
      }

      let hasNew = false;
      for (const d of snapshot.docs){
        if (!knownIds.has(d.id)){
          hasNew = true;
          break;
        }
      }

      if (hasNew){
        playSound();
        toast("新しい注文が入りました");
      }

      knownIds = currentIds;
    }, (e) => {
      console.error(e);
      toast("注文の取得に失敗しました");
      orderList.innerHTML = `<div class="empty">注文の取得に失敗しました</div>`;
    });
  </script>
</body>
</html>
