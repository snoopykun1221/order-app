<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>飲み放題メニュー</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#0b0d10;
  color:#fff;
}

.wrap{padding:16px;}

h1{
  text-align:center;
  color:#c8a45a;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:20px;
}

.item{
  border:1px solid rgba(255,255,255,.1);
  padding:12px;
  border-radius:12px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:center;
}

.name{font-weight:bold;}

.controls{
  display:flex;
  gap:6px;
}

button{
  border:none;
  padding:8px 10px;
  border-radius:8px;
  font-weight:bold;
}

.add{background:#333;color:#fff;}
.direct{background:#a40000;color:#fff;}
</style>
</head>

<body>

<div class="wrap">
  <h1>飲み放題メニュー</h1>

  <div id="menu" class="menu"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBwehY...",
  authDomain: "order-app-ec18b.firebaseapp.com",
  projectId: "order-app-ec18b",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ===== メニュー =====
const MENU = [
  {id:"beer1", name:"クラシック"},
  {id:"beer2", name:"黒ラベル"},
  {id:"soft1", name:"カルピス"},
  {id:"high1", name:"ハイボール"},
];

// ===== URL table取得 =====
const params = new URLSearchParams(location.search);
const table = Number(params.get("table"));
const tableOk = Number.isFinite(table) && table > 0;

// ===== 振動 =====
function vibrate(){
  if(navigator.vibrate) navigator.vibrate(60);
}

// ===== 即注文 =====
async function directOrder(item){
  if(!tableOk){
    alert("table必要");
    return;
  }

  try{
    await addDoc(collection(db,"orders"),{
      table,
      items:[{name:item.name,qty:1}],
      total:0,
      totalQty:1,
      createdAt:serverTimestamp()
    });

    vibrate();
    alert(item.name+" 注文！");
  }catch(e){
    alert("失敗");
  }
}

// ===== カート（簡易） =====
let cart = [];

function addCart(item){
  cart.push(item.name);
  alert("カート追加");
}

// ===== 描画 =====
const menuEl = document.getElementById("menu");

menuEl.innerHTML = MENU.map(m=>`
  <div class="item">
    <div class="name">${m.name}</div>
    <div class="controls">
      <button class="add" data-add="${m.id}">カート</button>
      <button class="direct" data-direct="${m.id}">注文</button>
    </div>
  </div>
`).join("");

menuEl.addEventListener("click",(e)=>{
  const add = e.target.closest("[data-add]");
  const direct = e.target.closest("[data-direct]");

  if(add){
    const m = MENU.find(x=>x.id===add.dataset.add);
    addCart(m);
  }

  if(direct){
    const m = MENU.find(x=>x.id===direct.dataset.direct);
    directOrder(m);
  }
});
</script>

</body>
</html>
