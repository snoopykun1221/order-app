<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
  <title>北海道本格ジンギスカン ひつじや｜ご注文</title>

  <style>
    :root{
      --bg:#3b2a20;
      --bg2:#2b1d16;
      --line:rgba(255,245,230,.14);
      --text:#fff8f0;
      --muted:rgba(255,240,225,.72);
      --gold:#e0b86b;
      --danger:#8f1f1f;
      --danger2:#6f1313;
      --shadow:0 18px 60px rgba(0,0,0,.35);
      --radius:18px;
    }

    *{ box-sizing:border-box; }

    html, body{
      max-width:100%;
      overflow-x:hidden;
    }

    body{
      margin:0;
      font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(224,184,107,.12), transparent 70%),
        radial-gradient(900px 500px at 90% 0%, rgba(224,184,107,.08), transparent 70%),
        linear-gradient(180deg,#5a4030 0%, var(--bg) 55%, var(--bg2) 100%);
      color:var(--text);
      font-size:14px;
      overflow-x:hidden;
    }

    body.menu-open{
      overflow:hidden;
      touch-action:none;
    }

    .wrap{
      max-width:1200px;
      margin:0 auto;
      padding:20px 12px 96px;
    }

    header{
      padding:10px 0 18px;
      border-bottom:1px solid var(--line);
      margin-bottom:14px;
      position:relative;
    }

    .title-with-sheep{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      flex-wrap:nowrap;
    }

    .title-text{
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:min(92vw, 680px);
    }

    @media (max-width: 480px){
      .title-text{
        white-space:normal;
        display:-webkit-box;
        -webkit-line-clamp:2;
        -webkit-box-orient:vertical;
        max-width:92vw;
      }
    }

    .sheep-icon{
      width:30px;
      height:30px;
      flex:0 0 auto;
      filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));
      opacity:.95;
      object-fit:contain;
    }

    .title{
      font-size:clamp(20px, 4.6vw, 30px);
      font-weight:1000;
      letter-spacing:.05em;
      color:var(--gold);
      margin:0 0 6px;
      line-height:1.15;
      font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    }

    .sub{
      margin:0;
      color:var(--muted);
      font-size:clamp(12px, 2.6vw, 14px);
      text-align:center;
    }

    .topRow{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
      margin-top:8px;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,248,240,.06);
      color:var(--muted);
      font-size:12px;
    }

    .pill strong{ color:var(--text); }

    .layout{
      display:grid;
      grid-template-columns:1fr;
      gap:16px;
    }

    @media (min-width: 980px){
      .layout{
        grid-template-columns:240px 1fr;
        align-items:start;
      }
    }

    .navCard{
      background:linear-gradient(180deg, rgba(255,248,240,.06), rgba(255,248,240,.03));
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      position:sticky;
      top:14px;
      backdrop-filter:blur(3px);
    }

    .navTitle{
      padding:14px;
      font-weight:1000;
      color:var(--gold);
      border-bottom:1px solid var(--line);
      background:rgba(255,248,240,.05);
      letter-spacing:.08em;
      font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    }

    .navList{
      display:flex;
      flex-direction:column;
      gap:8px;
      padding:12px;
    }

    .navBtn{
      display:flex;
      justify-content:space-between;
      align-items:center;
      border:1px solid var(--line);
      background:rgba(255,248,240,.06);
      color:var(--text);
      padding:12px 14px;
      border-radius:14px;
      text-decoration:none;
      font-weight:900;
      font-size:17px;
      transition:.18s ease;
      cursor:pointer;
      gap:10px;
      font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
      letter-spacing:.03em;
    }

    .navBtn:hover{
      background:rgba(224,184,107,.12);
      border-color:rgba(224,184,107,.35);
      transform:translateY(-1px);
    }

    .navBtn small{
      color:var(--muted);
      font-weight:800;
      font-size:13px;
    }

    .navBtn.active{
      background:rgba(224,184,107,.16);
      border-color:rgba(224,184,107,.55);
      color:var(--gold);
    }

    @media (max-width: 979px){
      .navCard{ display:none; }
    }

    .card{
      background:linear-gradient(180deg, rgba(255,248,240,.05), rgba(255,248,240,.025));
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      backdrop-filter:blur(3px);
    }

    .panelTitle{
      padding:14px 16px;
      font-weight:1000;
      color:var(--gold);
      border-bottom:1px solid var(--line);
      background:rgba(255,248,240,.05);
      letter-spacing:.08em;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    }

    .menuWrap{ padding:14px; }

    .section{
      margin:8px 0 18px;
      scroll-margin-top:86px;
    }

    .sectionHead{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:12px;
      padding:10px 10px 12px;
      border-bottom:1px solid var(--line);
      margin-bottom:12px;
    }

    .sectionHead h2{
      margin:0;
      font-size:18px;
      font-weight:1000;
      letter-spacing:.06em;
      color:var(--text);
      font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    }

    .sectionHead p{
      margin:0;
      font-size:12px;
      color:var(--muted);
    }

    .menuGrid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .itemCard{
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height:220px;
      position:relative;
      overflow:hidden;
      transition:transform .12s ease, box-shadow .18s ease;
      background:
        linear-gradient(180deg, rgba(255,248,240,.09), rgba(255,248,240,.045)),
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.07) 0 8%, transparent 9%),
        radial-gradient(circle at 75% 35%, rgba(255,255,255,.05) 0 7%, transparent 8%),
        radial-gradient(circle at 40% 80%, rgba(255,255,255,.04) 0 6%, transparent 7%),
        linear-gradient(135deg, rgba(255,250,242,.10), rgba(235,220,195,.05));
      background-size:auto, 180px 180px, 220px 220px, 200px 200px, auto;
    }

    .itemCard::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,.018) 0px,
          rgba(255,255,255,.018) 1px,
          transparent 1px,
          transparent 4px
        );
      mix-blend-mode:screen;
      opacity:.25;
    }

    .itemCard:hover{
      transform:translateY(-1px);
      box-shadow:0 12px 30px rgba(0,0,0,.16);
    }

    .itemCard.flash{
      box-shadow:0 0 0 2px rgba(224,184,107,.55), 0 18px 60px rgba(0,0,0,.35);
      transform:translateY(-1px);
    }

    .flashMark{
      position:absolute;
      top:10px;
      right:10px;
      width:32px;
      height:32px;
      border-radius:999px;
      display:none;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(255,245,230,.18);
      background:rgba(60,40,30,.35);
      font-weight:1000;
      z-index:1;
    }

    .itemCard.flash .flashMark{ display:flex; }

    .itemCard h3{
      margin:0;
      font-size:16px;
      font-weight:1000;
      letter-spacing:.03em;
      line-height:1.2;
      font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
      position:relative;
      z-index:1;
    }

    .desc{
      margin:0;
      font-size:12px;
      color:var(--muted);
      line-height:1.35;
      min-height:14px;
      position:relative;
      z-index:1;
    }

    .tagline{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-top:2px;
      position:relative;
      z-index:1;
    }

    .tag{
      display:inline-flex;
      align-items:center;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid rgba(255,245,230,.10);
      background:rgba(255,248,240,.05);
      color:rgba(255,248,240,.9);
      font-size:12px;
      font-weight:900;
      letter-spacing:.02em;
    }

    .tag.gold{
      border-color:rgba(224,184,107,.35);
      background:rgba(224,184,107,.10);
      color:var(--gold);
    }

    .stepRow{
      margin-top:auto;
      display:grid;
      gap:8px;
      position:relative;
      z-index:1;
    }

    .stepper{
      display:flex;
      align-items:center;
      gap:10px;
      border:1px solid var(--line);
      background:rgba(255,248,240,.05);
      border-radius:14px;
      padding:8px 10px;
      min-width:148px;
      justify-content:center;
    }

    .stepBtn{
      width:36px;
      height:36px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(255,248,240,.08);
      color:var(--text);
      font-weight:1000;
      cursor:pointer;
      font-size:18px;
      flex:0 0 auto;
      font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
      transition:transform .12s ease, background .18s ease, box-shadow .18s ease;
    }

    .stepBtn:hover{
      background:rgba(255,248,240,.14);
    }

    .stepBtn:active{
      transform:scale(.94);
      box-shadow:0 0 0 2px rgba(224,184,107,.18) inset;
    }

    .stepQty{
      min-width:24px;
      text-align:center;
      font-weight:1000;
      font-size:18px;
      flex:0 0 auto;
    }

    .cartAddBtn,
    .cartBtn,
    .orderBtn{
      border:none;
      cursor:pointer;
      font-weight:1000;
      transition:transform .12s ease, filter .18s ease, box-shadow .18s ease;
      font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    }

    .cartAddBtn{
      width:100%;
      height:42px;
      border-radius:14px;
      background:linear-gradient(180deg, rgba(224,184,107,.22), rgba(170,120,55,.18));
      color:var(--gold);
      border:1px solid rgba(224,184,107,.38);
      letter-spacing:.04em;
    }

    .cartAddBtn:hover,
    .cartBtn:hover,
    .orderBtn:hover{
      filter:brightness(1.04);
    }

    .cartAddBtn:active,
    .cartBtn:active,
    .orderBtn:active{
      transform:scale(.97);
    }

    .note{
      margin-top:2px;
      text-align:center;
      color:var(--muted);
      font-size:11px;
      line-height:1.4;
      position:relative;
      z-index:1;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:84px;
      transform:translateX(-50%);
      background:rgba(56,38,28,.95);
      border:1px solid var(--line);
      color:var(--text);
      padding:12px 14px;
      border-radius:14px;
      box-shadow:var(--shadow);
      font-weight:900;
      display:none;
      max-width:min(560px, 92vw);
      z-index:9999;
      text-align:center;
    }

    .hamburger{
      display:none;
      position:fixed;
      top:calc(env(safe-area-inset-top) + 14px);
      left:14px;
      z-index:1002;
      width:44px;
      height:44px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(70,48,35,.40);
      backdrop-filter:blur(10px);
      cursor:pointer;
      align-items:center;
      justify-content:center;
      gap:3px;
      flex-direction:column;
    }

    .hamburger span{
      width:18px;
      height:2px;
      background:rgba(255,248,240,.9);
      border-radius:2px;
      display:block;
    }

    .drawerOverlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.45);
      z-index:1000;
      opacity:0;
      pointer-events:none;
      transition:opacity .18s ease;
    }

    .drawerOverlay.show{
      opacity:1;
      pointer-events:auto;
    }

    .drawer{
      position:fixed;
      top:env(safe-area-inset-top);
      left:0;
      height:calc(100dvh - env(safe-area-inset-top));
      width:min(320px, 86vw);
      z-index:1001;
      transform:translateX(-102%);
      transition:transform .18s ease;
      padding:24px 14px 14px;
      background:rgba(58,40,30,.96);
      backdrop-filter:blur(12px);
      border-right:1px solid rgba(255,245,230,.10);
      box-shadow:0 18px 60px rgba(0,0,0,.35);
      overflow:auto;
    }

    .drawer.show{ transform:translateX(0); }

    .drawerHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:6px 4px 12px;
      border-bottom:1px solid rgba(255,245,230,.10);
      margin-bottom:10px;
      margin-top:6px;
    }

    .drawerTitle{
      font-weight:1000;
      color:var(--gold);
      letter-spacing:.08em;
      font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    }

    .drawerClose{
      width:36px;
      height:36px;
      border-radius:10px;
      border:1px solid var(--line);
      background:rgba(255,248,240,.04);
      color:rgba(255,248,240,.9);
      font-size:18px;
      cursor:pointer;
    }

    .cartSheet{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:10010;
      transform:translateY(110%);
      transition:transform .22s ease;
      background:linear-gradient(180deg, rgba(72,50,38,.98), rgba(48,33,25,.98));
      border-top:1px solid var(--line);
      border-top-left-radius:20px;
      border-top-right-radius:20px;
      box-shadow:0 -14px 40px rgba(0,0,0,.32);
      max-height:72vh;
      overflow:hidden;
    }

    .cartSheet.show{
      transform:translateY(0);
    }

    .cartSheetHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 16px;
      border-bottom:1px solid var(--line);
      color:var(--gold);
      font-weight:1000;
      letter-spacing:.06em;
    }

    .cartSheetClose{
      width:34px;
      height:34px;
      border-radius:10px;
      border:1px solid var(--line);
      background:rgba(255,248,240,.05);
      color:var(--text);
      font-size:18px;
      cursor:pointer;
    }

    .cartSheetBody{
      padding:14px 14px 90px;
      overflow:auto;
      max-height:calc(72vh - 58px);
    }

    .cartEmpty{
      color:var(--muted);
      text-align:center;
      padding:24px 10px;
      border:1px dashed var(--line);
      border-radius:14px;
      background:rgba(255,248,240,.03);
    }

    .cartList{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .cartRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px 12px;
      background:rgba(255,248,240,.05);
    }

    .cartName{
      font-weight:1000;
      line-height:1.4;
    }

    .cartMeta{
      color:var(--muted);
      font-size:12px;
      margin-top:2px;
    }

    .cartQtyBox{
      display:flex;
      align-items:center;
      gap:8px;
      flex-shrink:0;
    }

    .cartQtyBtn{
      width:34px;
      height:34px;
      border-radius:10px;
      border:1px solid var(--line);
      background:rgba(255,248,240,.08);
      color:var(--text);
      font-size:18px;
      cursor:pointer;
      transition:transform .12s ease;
    }

    .cartQtyBtn:active{
      transform:scale(.94);
    }

    .cartQty{
      min-width:20px;
      text-align:center;
      font-weight:1000;
      font-size:16px;
    }

    .bottomBar{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      display:flex;
      gap:10px;
      padding:10px 12px calc(10px + env(safe-area-inset-bottom));
      background:rgba(52,36,27,.96);
      border-top:1px solid var(--line);
      backdrop-filter:blur(10px);
      z-index:9998;
    }

    .cartBtn{
      flex:1;
      border-radius:14px;
      background:linear-gradient(180deg, rgba(224,184,107,.22), rgba(170,120,55,.18));
      color:var(--gold);
      border:1px solid rgba(224,184,107,.38);
      padding:14px 12px;
      font-size:15px;
      letter-spacing:.04em;
    }

    .orderBtn{
      flex:1.2;
      border-radius:14px;
      background:linear-gradient(180deg, var(--danger), var(--danger2));
      color:#fff;
      padding:14px 12px;
      font-size:15px;
      letter-spacing:.06em;
      box-shadow:0 10px 24px rgba(111,19,19,.25);
    }

    .btnCount{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:22px;
      height:22px;
      padding:0 7px;
      margin-left:6px;
      border-radius:999px;
      border:1px solid rgba(255,245,230,.18);
      background:rgba(255,248,240,.08);
      font-size:12px;
      color:var(--text);
    }

    .foot{
      margin-top:18px;
      text-align:center;
      color:rgba(255,240,225,.5);
      font-size:12px;
    }

    @media (max-width: 979px){
      .wrap{ padding:14px 12px 96px; }
      header{ padding:8px 0 14px; margin-bottom:14px; }
      .menuWrap{ padding:12px; }
      .panelTitle{ padding:12px 14px; }
      .card{ box-shadow:0 10px 30px rgba(0,0,0,.30); }
      .hamburger{ display:flex; }
    }

    @media (max-width: 640px){
      .menuGrid{
        grid-template-columns:1fr 1fr;
        gap:10px;
      }

      .itemCard{
        min-height:220px;
        padding:10px;
      }

      .itemCard h3{
        font-size:15px;
      }

      .stepper{
        min-width:100%;
        gap:8px;
      }

      .stepBtn{
        width:32px;
        height:32px;
      }

      .stepQty{
        font-size:16px;
      }
    }
  </style>
</head>

<body>
  <button id="hamburger" class="hamburger" aria-label="カテゴリを開く">
    <span></span><span></span><span></span>
  </button>

  <div id="drawerOverlay" class="drawerOverlay"></div>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawerHead">
      <div class="drawerTitle">カテゴリ</div>
      <button id="drawerClose" class="drawerClose" aria-label="閉じる">×</button>
    </div>
    <div id="drawerNav" class="navList"></div>
  </aside>

  <div class="wrap">
    <header>
      <div class="title-with-sheep">
        <img src="assets/sheep.png.jpg" alt="ひつじ" class="sheep-icon" onerror="this.style.display='none'">
        <div class="title-text">
          <h1 class="title">北海道本格ジンギスカン ひつじや</h1>
          <p class="sub">ごゆっくりお選びください</p>
        </div>
        <img src="assets/sheep.png.jpg" alt="ひつじ" class="sheep-icon" onerror="this.style.display='none'">
      </div>

      <div class="topRow">
        <div id="tablePill" class="pill" style="display:none;">
          テーブル <strong id="tableNo">-</strong>
        </div>
      </div>
    </header>

    <div class="layout">
      <aside class="navCard">
        <div class="navTitle">カテゴリ</div>
        <div id="catNav" class="navList"></div>
      </aside>

      <section class="card">
        <div class="panelTitle">
          <span>メニュー</span>
        </div>
        <div class="menuWrap" id="menu"></div>
      </section>
    </div>

    <div class="foot">※ 数量を決めてカートに入れ、最後に注文してください</div>
  </div>

  <div id="toast" class="toast"></div>

  <div id="cartSheet" class="cartSheet">
    <div class="cartSheetHead">
      <span>カート</span>
      <button id="cartSheetClose" class="cartSheetClose" aria-label="閉じる">×</button>
    </div>
    <div class="cartSheetBody">
      <div id="cartContent"></div>
    </div>
  </div>

  <div class="bottomBar">
    <button id="cartBtn" class="cartBtn">カート <span id="cartCount" class="btnCount">0</span></button>
    <button id="orderBtn" class="orderBtn">注文する</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import {
      getFirestore, collection, addDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBwehYqjyO7R982qHjTMiNGjQ2yPNEA7YU",
      authDomain: "order-app-ec18b.firebaseapp.com",
      projectId: "order-app-ec18b",
      storageBucket: "order-app-ec18b.firebasestorage.app",
      messagingSenderId: "756193856808",
      appId: "1:756193856808:web:f2200287017adaf895541d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const CATEGORIES = [
      { id:"beer", label:"ビール" },
      { id:"high", label:"ハイボール" },
      { id:"sour", label:"サワー" },
      { id:"cock", label:"カクテル" },
      { id:"wine", label:"ワイン" },
      { id:"soft", label:"ソフトドリンク" }
    ];

    const MENU = [
      { id:"beer_classic", category:"beer", name:"クラシック", desc:"", tags:["飲み放題"] },
      { id:"beer_black", category:"beer", name:"黒ラベル", desc:"", tags:["飲み放題"] },

      { id:"high_std", category:"high", name:"ハイボール", desc:"", tags:["飲み放題"] },
      { id:"high_coke", category:"high", name:"コークハイ", desc:"", tags:["飲み放題"] },
      { id:"high_ginger", category:"high", name:"ジンジャーハイ", desc:"", tags:["飲み放題"] },

      { id:"sour_lemon", category:"sour", name:"レモンサワー", desc:"", tags:["飲み放題"] },
      { id:"sour_grape", category:"sour", name:"グレープフルーツサワー", desc:"", tags:["飲み放題"] },
      { id:"sour_ume", category:"sour", name:"梅サワー", desc:"", tags:["飲み放題"] },

      { id:"cock_cassis_orange", category:"cock", name:"カシスオレンジ", desc:"", tags:["飲み放題"] },
      { id:"cock_fuzzy", category:"cock", name:"ファジーネーブル", desc:"", tags:["飲み放題"] },
      { id:"cock_cassis_soda", category:"cock", name:"カシスソーダ", desc:"", tags:["飲み放題"] },

      { id:"wine_red", category:"wine", name:"赤ワイン", desc:"", tags:["飲み放題"] },
      { id:"wine_white", category:"wine", name:"白ワイン", desc:"", tags:["飲み放題"] },

      { id:"soft_calpis", category:"soft", name:"カルピス", desc:"", tags:["飲み放題"] },
      { id:"soft_oolong", category:"soft", name:"ウーロン茶", desc:"", tags:["飲み放題"] },
      { id:"soft_cola", category:"soft", name:"コーラ", desc:"", tags:["飲み放題"] },
      { id:"soft_ginger", category:"soft", name:"ジンジャーエール", desc:"", tags:["飲み放題"] },
      { id:"soft_orange", category:"soft", name:"オレンジジュース", desc:"", tags:["飲み放題"] }
    ];

    const qs = new URLSearchParams(location.search);
    const tableParam = qs.get("table");
    const table = Number(tableParam);
    const tableOk = Number.isFinite(table) && table > 0;

    const tablePill = document.getElementById("tablePill");
    const tableNoEl = document.getElementById("tableNo");
    const catNavEl = document.getElementById("catNav");
    const drawerNavEl = document.getElementById("drawerNav");
    const menuEl = document.getElementById("menu");
    const cartBtn = document.getElementById("cartBtn");
    const orderBtn = document.getElementById("orderBtn");
    const cartCount = document.getElementById("cartCount");
    const cartSheet = document.getElementById("cartSheet");
    const cartContent = document.getElementById("cartContent");
    const cartSheetClose = document.getElementById("cartSheetClose");

    const CART_KEY = tableOk ? `drink_cart_table_${table}` : "drink_cart_unknown";
    let cart = {};
    let addQty = {};

    try{
      const saved = localStorage.getItem(CART_KEY);
      if (saved) cart = JSON.parse(saved) || {};
    } catch {}

    if (tableOk) {
      tablePill.style.display = "inline-flex";
      tableNoEl.textContent = String(table);
    }

    function toast(msg){
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => t.style.display = "none", 2200);
    }

    if (!tableOk){
      toast("URLに ?table=1 のようにテーブル番号を付けてください");
    }

    function safeText(v, fallback="-"){
      if (v === null || v === undefined) return fallback;
      const s = String(v).trim();
      return s.length ? s : fallback;
    }

    function vibrateOnSuccess(ms = 60){
      try{
        if (typeof navigator !== "undefined" && "vibrate" in navigator) {
          navigator.vibrate(ms);
        }
      } catch {}
    }

    function saveCart(){
      try{
        localStorage.setItem(CART_KEY, JSON.stringify(cart));
      } catch {}
    }

    function totalCartCount(){
      return Object.values(cart).reduce((sum, item) => sum + Number(item.qty || 0), 0);
    }

    function updateCartCount(){
      cartCount.textContent = String(totalCartCount());
    }

    function getAddQty(id){
      const v = Number(addQty[id] ?? 1);
      return Math.max(1, Math.min(10, v));
    }

    function setAddQty(id, v){
      addQty[id] = Math.max(1, Math.min(10, Number(v) || 1));
    }

    function addToCart(id){
      const m = MENU.find(x => x.id === id);
      if (!m) return;

      const qty = getAddQty(id);
      if (!cart[id]) cart[id] = { id:m.id, name:m.name, qty:0 };
      cart[id].qty += qty;

      saveCart();
      updateCartCount();
      renderCartSheet();
      toast(`${m.name} ×${qty} をカートに入れました`);

      const card = menuEl.querySelector(`.itemCard[data-item="${CSS.escape(id)}"]`);
      if (card){
        card.classList.add("flash");
        clearTimeout(card._flashTimer);
        card._flashTimer = setTimeout(() => card.classList.remove("flash"), 420);
      }
    }

    async function submitOrder(){
      if (!tableOk){
        toast("テーブル番号が必要です");
        return;
      }

      const items = Object.values(cart).filter(x => x.qty > 0);
      if (!items.length){
        toast("カートが空です");
        return;
      }

      const totalQty = items.reduce((sum, x) => sum + x.qty, 0);
      const ok = confirm(`テーブル${table}の飲み物を注文します。\n点数: ${totalQty}\nよろしいですか？`);
      if (!ok) return;

      orderBtn.disabled = true;
      const oldText = orderBtn.textContent;
      orderBtn.textContent = "送信中…";

      try{
        await addDoc(collection(db, "orders"), {
          type: "drink",
          table: table,
          items: items.map(x => ({ name:x.name, qty:x.qty })),
          total: 0,
          totalQty: totalQty,
          status: "new",
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });

        cart = {};
        saveCart();
        updateCartCount();
        renderCartSheet();
        closeCartSheet();
        vibrateOnSuccess(80);
        toast("注文しました");
      } catch (e){
        console.error(e);
        toast("注文に失敗しました");
      } finally {
        orderBtn.textContent = oldText;
        orderBtn.disabled = false;
      }
    }

    function renderCartSheet(){
      const items = Object.values(cart).filter(x => x.qty > 0);

      if (!items.length){
        cartContent.innerHTML = `<div class="cartEmpty">カートは空です</div>`;
        return;
      }

      cartContent.innerHTML = `
        <div class="cartList">
          ${items.map(item => `
            <div class="cartRow">
              <div style="min-width:0;">
                <div class="cartName">${item.name}</div>
                <div class="cartMeta">飲み放題</div>
              </div>
              <div class="cartQtyBox">
                <button class="cartQtyBtn" data-cart-minus="${item.id}">−</button>
                <div class="cartQty">${item.qty}</div>
                <button class="cartQtyBtn" data-cart-plus="${item.id}">＋</button>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    cartContent.addEventListener("click", (e) => {
      const minus = e.target.closest("[data-cart-minus]");
      const plus = e.target.closest("[data-cart-plus]");

      if (minus){
        const id = minus.getAttribute("data-cart-minus");
        if (!cart[id]) return;
        cart[id].qty = Math.max(0, cart[id].qty - 1);
        if (cart[id].qty === 0) delete cart[id];
        saveCart();
        updateCartCount();
        renderCartSheet();
        return;
      }

      if (plus){
        const id = plus.getAttribute("data-cart-plus");
        if (!cart[id]) return;
        cart[id].qty += 1;
        saveCart();
        updateCartCount();
        renderCartSheet();
      }
    });

    function openCartSheet(){
      cartSheet.classList.add("show");
    }

    function closeCartSheet(){
      cartSheet.classList.remove("show");
    }

    cartBtn.addEventListener("click", openCartSheet);
    cartSheetClose.addEventListener("click", closeCartSheet);
    orderBtn.addEventListener("click", submitOrder);

    const hamburger = document.getElementById("hamburger");
    const drawer = document.getElementById("drawer");
    const drawerOverlay = document.getElementById("drawerOverlay");
    const drawerClose = document.getElementById("drawerClose");

    function openDrawer(){
      drawer.classList.add("show");
      drawerOverlay.classList.add("show");
      drawer.setAttribute("aria-hidden", "false");
      document.body.classList.add("menu-open");
    }

    function closeDrawer(){
      drawer.classList.remove("show");
      drawerOverlay.classList.remove("show");
      drawer.setAttribute("aria-hidden", "true");
      document.body.classList.remove("menu-open");
    }

    hamburger?.addEventListener("click", openDrawer);
    drawerClose?.addEventListener("click", closeDrawer);
    drawerOverlay?.addEventListener("click", () => {
      closeDrawer();
      closeCartSheet();
    });

    function goCategory(catId){
      const el = document.getElementById(`cat-${catId}`);
      if (el) el.scrollIntoView({ behavior:"smooth", block:"start" });
      closeDrawer();
    }

    function renderNavInto(container){
      if (!container) return;

      const counts = new Map();
      for (const c of CATEGORIES) {
        counts.set(c.id, MENU.filter(m => m.category === c.id).length);
      }

      container.innerHTML = CATEGORIES.map(c => {
        const count = counts.get(c.id) ?? 0;
        return `<a class="navBtn" data-nav="${c.id}" href="#cat-${c.id}">
          <span>${c.label}</span><small>${count}</small>
        </a>`;
      }).join("");

      container.querySelectorAll("a.navBtn").forEach(a => {
        a.addEventListener("click", (e) => {
          const key = a.getAttribute("data-nav");
          if (!key) return;
          e.preventDefault();
          goCategory(key);
        });
      });
    }

    function renderNav(){
      renderNavInto(catNavEl);
      renderNavInto(drawerNavEl);
    }

    function renderMenu(){
      const byCat = new Map();
      for (const c of CATEGORIES) byCat.set(c.id, []);
      for (const m of MENU) {
        if (!byCat.has(m.category)) byCat.set(m.category, []);
        byCat.get(m.category).push(m);
      }

      menuEl.innerHTML = CATEGORIES.map(c => {
        const items = byCat.get(c.id) || [];

        const grid = items.map(m => {
          const qty = getAddQty(m.id);
          const tags = Array.isArray(m.tags) ? m.tags : [];
          const tagsHtml = tags.length ? `
            <div class="tagline">
              ${tags.map(t => `<span class="tag ${t === "飲み放題" ? "gold" : ""}">${t}</span>`).join("")}
            </div>
          ` : `<div class="tagline"></div>`;

          return `
            <div class="itemCard" data-item="${m.id}">
              <div class="flashMark">✓</div>

              <div style="min-width:0;">
                <h3>${safeText(m.name, "-")}</h3>
                <p class="desc">${safeText(m.desc, "")}</p>
                ${tagsHtml}
              </div>

              <div class="stepRow">
                <div class="stepper" aria-label="数量">
                  <button class="stepBtn" data-step-minus="${m.id}">−</button>
                  <div class="stepQty" data-step-qty="${m.id}">${qty}</div>
                  <button class="stepBtn" data-step-plus="${m.id}">＋</button>
                </div>
                <button class="cartAddBtn" data-cart-add="${m.id}">カートに入れる</button>
              </div>

              <div class="note">数量を決めてカートに入れてください</div>
            </div>
          `;
        }).join("");

        return `
          <div class="section" id="cat-${c.id}">
            <div class="sectionHead">
              <h2>${c.label}</h2>
              <p>${items.length} 品</p>
            </div>
            <div class="menuGrid">
              ${grid || `<div style="color:var(--muted);padding:6px 10px;">（準備中）</div>`}
            </div>
          </div>
        `;
      }).join("");
    }

    menuEl.addEventListener("click", (e) => {
      const btnMinus = e.target.closest("[data-step-minus]");
      const btnPlus = e.target.closest("[data-step-plus]");
      const btnCartAdd = e.target.closest("[data-cart-add]");

      if (btnMinus){
        const id = btnMinus.getAttribute("data-step-minus");
        setAddQty(id, getAddQty(id) - 1);
        const qEl = menuEl.querySelector(`[data-step-qty="${CSS.escape(id)}"]`);
        if (qEl) qEl.textContent = String(getAddQty(id));
        return;
      }

      if (btnPlus){
        const id = btnPlus.getAttribute("data-step-plus");
        setAddQty(id, getAddQty(id) + 1);
        const qEl = menuEl.querySelector(`[data-step-qty="${CSS.escape(id)}"]`);
        if (qEl) qEl.textContent = String(getAddQty(id));
        return;
      }

      if (btnCartAdd){
        const id = btnCartAdd.getAttribute("data-cart-add");
        addToCart(id);
      }
    });

    updateCartCount();
    renderCartSheet();
    renderNav();
    renderMenu();
  </script>
</body>
</html>
