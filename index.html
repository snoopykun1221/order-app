<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ひつじや 飲み放題オーダー</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Firebase CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.firebaseDb = db;
    window.firebaseAddDoc = addDoc;
    window.firebaseCollection = collection;
    window.firebaseServerTimestamp = serverTimestamp;
  </script>
</head>
<body>
  <header class="header">
    <h1>ひつじや</h1>
    <p class="sub">飲み放題オーダー</p>
  </header>

  <main class="container">
    <section class="info-box">
      <div>テーブル番号: <span id="tableNumber">未設定</span></div>
      <div>コース: <strong>飲み放題</strong></div>
    </section>

    <section id="menuArea" class="menu-area"></section>
  </main>

  <footer class="cart-footer">
    <div class="cart-summary">
      <div>注文数: <span id="totalCount">0</span>点</div>
    </div>
    <button id="submitOrderBtn" class="submit-btn">注文する</button>
  </footer>

  <div id="toast" class="toast"></div>

  <script src="menu.js"></script>
  <script src="app.js"></script>
</body>
</html>
