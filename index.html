<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
<title>北海道本格ジンギスカン ひつじや｜ご注文</title>

<style>
:root{
  --bg:#3b2a20;
  --line:rgba(255,245,230,.14);
  --text:#fff8f0;
  --muted:rgba(255,240,225,.72);
  --gold:#e0b86b;
  --danger:#8f1f1f;
  --danger2:#6f1313;
  --shadow:0 18px 60px rgba(0,0,0,.35);
  --radius:18px;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  background:
    radial-gradient(1200px 600px at 20% -10%, rgba(224,184,107,.12), transparent 70%),
    radial-gradient(900px 500px at 90% 0%, rgba(224,184,107,.08), transparent 70%),
    linear-gradient(180deg,#5a4030,#2b1d16);
  color:var(--text);
  font-size:14px;
  overflow-x:hidden;
}

.wrap{
  max-width:1200px;
  margin:0 auto;
  padding:20px 12px 28px;
}

.title{
  font-weight:1000;
  color:var(--gold);
}

.title,
.navTitle,
.panelTitle,
.sectionHead h2{
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  letter-spacing:.05em;
}

.navBtn{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border:1px solid var(--line);
  background:rgba(255,248,240,.06);
  color:var(--text);
  padding:12px 14px;
  border-radius:14px;
  text-decoration:none;
  font-weight:900;
  font-size:17px;
  transition:.15s;
  cursor:pointer;
  gap:10px;
}

.navBtn small{
  color:var(--muted);
  font-weight:800;
  font-size:13px;
}

.card{
  background:linear-gradient(180deg, rgba(255,248,240,.05), rgba(255,248,240,.025));
}

.itemCard{
  background:rgba(255,248,240,.04);
}

/* 既存CSSはそのまま続く */
</style>
</head>

<body>

</html>
